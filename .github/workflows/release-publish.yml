name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.4.0)"
        required: true
        type: string
      validate_run_id:
        description: "Required: successful CI run ID from the tagged commit as release evidence"
        required: true
        type: string
      draft:
        description: "Keep as draft instead of publishing"
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    uses: Mininglamp-OSS/.github/.github/workflows/reusable-release-publish.yml@main
    with:
      tag: ${{ inputs.tag }}
      validate_run_id: ${{ inputs.validate_run_id }}
      draft: ${{ inputs.draft }}
    permissions:
      contents: write
      actions: read

  build-artifacts:
    needs: publish
    if: ${{ inputs.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # actions:write lets the final step dispatch npm-publish.yml. We do this
      # explicitly rather than letting npm-publish hook `on: release: published`,
      # because the publish job above changes the release state using
      # GITHUB_TOKEN, and GitHub's recursion rule suppresses workflow runs for
      # events caused by GITHUB_TOKEN — workflow_dispatch and
      # repository_dispatch are the only exempt events.
      actions: write
    steps:
      # SHA-pinned actions. build-artifacts holds contents:write +
      # actions:write and runs third-party code (goreleaser-action) that
      # builds the binaries whose checksums become the install-time trust
      # root, so any compromise here propagates into every install.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean --skip=publish,announce
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist artifacts
        run: ls -lh dist/

      - name: Validate tag before upload
        # Kept in lockstep with npm-publish.yml's resolver: MAJOR.MINOR.PATCH
        # is required (no patchless `v1.2`) so a tag accepted by this workflow
        # cannot be rejected by npm-publish.yml after archives are already on
        # the release.
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid tag: $TAG"; exit 1; }
        env:
          TAG: ${{ inputs.tag }}

      - name: Upload artifacts to release
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand off to the npm wrapper publish workflow. Sequenced after upload
      # so the archives + checksums.txt are guaranteed to be on the release
      # by the time the npm postinstall tries to download them. Uses
      # workflow_dispatch (exempt from GITHUB_TOKEN recursion suppression).
      #
      # --ref "$TAG" pins both (a) which version of npm-publish.yml runs and
      # (b) what its checkout step pulls — so the wrapper sources packaged
      # into the npm tarball match the release commit, not whatever main HEAD
      # happens to be at dispatch time.
      - name: Trigger npm publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run npm-publish.yml --ref "$TAG" -f tag="$TAG" -f dry_run=false
