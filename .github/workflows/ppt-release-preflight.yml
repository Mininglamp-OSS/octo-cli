name: PPT release preflight

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dry_run:
        required: true
        type: boolean

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Store the Bot secret ONLY in this environment, with required reviewers
    # and main-only deployment branches. Dry/draft runs receive no secret.
    environment: ${{ inputs.dry_run && 'ppt-gallery-dry-run' || 'ppt-gallery-release' }}
    permissions:
      contents: read
    steps:
      - name: Validate tag before probing
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Release tag must be v-prefixed semver.'
            exit 1
          fi
      - name: Require trusted release workflow ref
        if: ${{ !inputs.dry_run }}
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$WORKFLOW_REF" != 'refs/heads/main' ]; then
            echo '::error::Dispatch real publication from main; the tag remains the release input.'
            exit 1
          fi
      - name: Checkout release tooling, not the input tag
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        if: ${{ !inputs.dry_run }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify live PPT catalogue
        if: ${{ !inputs.dry_run }}
        env:
          PPT_RELEASE_API_ORIGIN: ${{ vars.PPT_RELEASE_API_ORIGIN }}
          PPT_RELEASE_SPACE_ID: ${{ vars.PPT_RELEASE_SPACE_ID }}
          PPT_RELEASE_BOT_TOKEN: ${{ secrets.PPT_RELEASE_BOT_TOKEN }}
        run: node scripts/ppt-release-preflight.mjs
      - name: Report non-publishing run
        if: ${{ inputs.dry_run }}
        run: echo 'Draft/dry run; no backend probes and no deployment evidence.'
