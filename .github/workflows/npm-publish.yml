# Publish @mininglamp-oss/octo-cli and its platform sub-packages.
#
# Distribution model: platform sub-packages carry the prebuilt binary inside
# the npm tarball (esbuild-style, os/cpu constrained); the main package pins
# them via optionalDependencies and ships only a Node shim. There is no
# postinstall download, so installs work through npm registry mirrors and never
# touch GitHub.
#
# This workflow has two entry points:
#   * workflow_call from release-publish.yml with from_artifact=true. It
#     consumes the same-run `goreleaser-dist` artifact produced by the build
#     job, so npm and GitHub Release share one binary build.
#   * workflow_dispatch for manual dry-runs or reruns. That path downloads the
#     archives from the published GitHub Release.
#
# Publish order matters: platform sub-packages first, main package last.
name: npm publish

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.6.0)"
        required: true
        type: string
      dry_run:
        description: "Run npm publish with --dry-run"
        required: false
        type: boolean
        default: false
      from_artifact:
        description: "Take dist/ from the same-run build artifact instead of the GitHub Release"
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.6.0)"
        required: true
        type: string
      dry_run:
        description: "Run npm publish with --dry-run (no actual upload)"
        required: false
        type: boolean
        default: true
      from_artifact:
        description: "Take dist/ from the same-run build artifact instead of the GitHub Release"
        required: false
        type: boolean
        default: false

concurrency:
  # A package version is immutable on npm; never let two publish attempts for the
  # same tag race each other.
  group: npm-publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Resolve version and dist-tag
        id: version
        working-directory: .
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          REF="$INPUT_TAG"
          if [ "$INPUT_DRY_RUN" = "true" ]; then DRY="--dry-run"; else DRY=""; fi
          if [[ ! "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::inputs.tag must be v-prefixed semver (got '$REF')."
            exit 1
          fi
          VERSION="${REF#v}"
          if [[ "$VERSION" == *-* ]]; then DIST_TAG="next"; else DIST_TAG="latest"; fi
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "DIST_TAG=$DIST_TAG"
            echo "DRY_RUN=$DRY"
          } >> "$GITHUB_OUTPUT"
          echo "[npm-publish] version=$VERSION dist-tag=$DIST_TAG dry_run='$DRY'"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ steps.version.outputs.TAG }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify release exists and is published
        if: steps.version.outputs.DRY_RUN == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          set -euo pipefail
          # Gate: a repo writer can create a Release outside this workflow; npm
          # publishing still requires the expected non-draft Release tag.
          if [ -z "$TAG" ]; then
            echo "::error::Empty TAG output from resolver step."
            exit 1
          fi
          info=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName 2>/dev/null) || {
            echo "::error::No GitHub Release for $TAG. Cut one via release-publish.yml first."
            exit 1
          }
          returned_tag=$(printf '%s' "$info" | jq -r '.tagName')
          if [ "$returned_tag" != "$TAG" ]; then
            echo "::error::gh release view returned '$returned_tag', expected '$TAG'. Refusing."
            exit 1
          fi
          is_draft=$(printf '%s' "$info" | jq -r '.isDraft')
          if [ "$is_draft" = "true" ]; then
            echo "::error::Release $TAG is still a draft; publish it first."
            exit 1
          fi
          echo "[npm-publish] release $TAG exists and is published."

      - name: Verify CI evidence for the tagged commit
        if: steps.version.outputs.DRY_RUN == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          set -euo pipefail
          # Gate: only publish tags whose target commit has a successful CI run.
          ref_data=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          ref_type=$(printf '%s' "$ref_data" | jq -r '.object.type')
          ref_sha=$(printf '%s' "$ref_data" | jq -r '.object.sha')
          if [ "$ref_type" = "tag" ]; then
            tag_obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha")
            target_type=$(printf '%s' "$tag_obj" | jq -r '.object.type')
            if [ "$target_type" != "commit" ]; then
              echo "::error::Annotated tag $TAG points to '$target_type', not a commit."
              exit 1
            fi
            ref_sha=$(printf '%s' "$tag_obj" | jq -r '.object.sha')
          fi
          ci_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$ref_sha&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | length')
          if [ "$ci_count" -eq 0 ]; then
            echo "::error::No successful CI run found for $TAG (commit $ref_sha)."
            exit 1
          fi
          echo "[npm-publish] CI evidence OK: $ci_count successful CI run(s) on $ref_sha."

      - name: Run packaging tests
        run: node --test scripts/prepare-packages.test.js

      - name: Download dist from build artifact
        if: ${{ inputs.from_artifact == true }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: goreleaser-dist
          path: npm/dist

      - name: Download release archives
        if: ${{ inputs.from_artifact != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.tar.gz' --pattern 'checksums.txt'
          ls -lh dist/

      - name: Verify checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist
          # Verify exactly the archives we are about to package. Do not use
          # --ignore-missing: a missing or only substring-matched archive must
          # fail before npm packages are generated.
          subset=$(mktemp)
          trap 'rm -f "$subset"' EXIT
          archive_count=0
          for f in *.tar.gz; do
            archive_count=$((archive_count + 1))
            line=$(awk -v file="$f" '$2 == file { print }' checksums.txt)
            if [ -z "$line" ]; then
              echo "::error::$f not covered exactly by checksums.txt"
              exit 1
            fi
            printf '%s\n' "$line" >> "$subset"
          done
          if [ "$archive_count" -eq 0 ]; then
            echo "::error::No release archives (*.tar.gz) found in dist/."
            exit 1
          fi
          sha256sum --check "$subset"

      - name: Generate npm packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: node scripts/prepare-packages.js --version "$VERSION" --dist dist --out build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ steps.version.outputs.DRY_RUN == '' && secrets.NPM_TOKEN || '' }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIST_TAG: ${{ steps.version.outputs.DIST_TAG }}
          DRY_RUN: ${{ steps.version.outputs.DRY_RUN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          npm_view() {
            local label="$1"
            shift
            local output=""
            for attempt in 1 2 3; do
              if output=$(npm view "$@" 2>&1); then
                printf '%s\n' "$output"
                return 0
              fi
              if printf '%s' "$output" | grep -Eiq '(^|[[:space:]])E404([[:space:]]|$)|404 Not Found|is not in this registry'; then
                return 1
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::npm view failed for $label after $attempt attempts." >&2
                printf '%s\n' "$output" >&2
                return 2
              fi
              echo "[npm-publish] npm view failed for $label (attempt $attempt/3); retrying" >&2
              sleep $((attempt * 5))
            done
          }

          version_exists() {
            local name="$1"
            local status
            if npm_view "$name@$VERSION" "$name@$VERSION" version >/dev/null; then
              return 0
            else
              status=$?
            fi
            if [ "$status" -eq 1 ]; then
              return 1
            fi
            exit 1
          }

          if [ "$DIST_TAG" = "latest" ]; then
            reg_latest=""
            if reg_latest=$(npm_view "@mininglamp-oss/octo-cli dist-tags.latest" "@mininglamp-oss/octo-cli" dist-tags.latest); then
              :
            else
              status=$?
              if [ "$status" -ne 1 ]; then exit 1; fi
            fi
            if [ -n "$reg_latest" ] && [ "$reg_latest" != "$VERSION" ] && \
               [ "$(printf '%s\n%s\n' "$reg_latest" "$VERSION" | sort -V | tail -n1)" = "$reg_latest" ]; then
              DIST_TAG="release-$VERSION"
              echo "[npm-publish] $VERSION < registry latest $reg_latest — publishing under dist-tag '$DIST_TAG' instead of latest"
            fi
          fi

          publish_one() {
            local dir="$1"
            local name
            name=$(node -p "require('./$dir/package.json').name")
            if [ -z "$DRY_RUN" ]; then
              if version_exists "$name"; then
                echo "[npm-publish] $name@$VERSION already on the registry — skipping"
                return 0
              fi
            fi
            echo "[npm-publish] publishing $name@$VERSION"
            if [ -n "$DRY_RUN" ]; then
              npm publish "./$dir" --access public --tag "$DIST_TAG" --provenance --ignore-scripts --dry-run
            else
              npm publish "./$dir" --access public --tag "$DIST_TAG" --provenance --ignore-scripts
            fi
          }

          # Publish platform packages first; the main package pins them via
          # optionalDependencies and must be last.
          for dir in build/octo-cli-*; do
            publish_one "$dir"
          done
          publish_one build/octo-cli
