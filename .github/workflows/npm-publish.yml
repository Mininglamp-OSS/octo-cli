# Publish the npm wrapper (@mininglamp-oss/octo-cli) when a GitHub Release is
# published. goreleaser builds and uploads the platform binaries to the same
# release; the npm package's postinstall downloads the matching one, so the
# published npm version MUST correspond to a real release tag.
#
# Tag → npm dist-tag:
#   v1.2.3        → @latest   (matches /^v\d+\.\d+\.\d+$/)
#   v1.2.3-rc.1   → @next     (any tag containing "-")
#
# A manual workflow_dispatch run supports --dry-run for testing without
# uploading.
name: npm publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.6.0)"
        required: true
        type: string
      dry_run:
        description: "Run npm publish with --dry-run (no actual upload)"
        required: false
        type: boolean
        default: true

concurrency:
  # Key on the version so a `release: published` run and a `workflow_dispatch`
  # of the same tag (which has a different github.ref) still serialize.
  group: npm-publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents:read lets `gh release view` enumerate assets while waiting for
    # goreleaser to finish uploading; nothing else uses elevated tokens.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version and dist-tag
        id: version
        # On a release event GITHUB_REF_NAME is the tag; on manual dispatch use
        # the `tag` input. VERSION drops the leading `v`; a version containing
        # `-` (prerelease) publishes to @next so it never clobbers @latest.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
            DRY="${{ inputs.dry_run && '--dry-run' || '' }}"
          else
            REF="${GITHUB_REF_NAME}"
            DRY=""
          fi
          VERSION="${REF#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing to publish: tag '$REF' does not look like a semver release."
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then DIST_TAG="next"; else DIST_TAG="latest"; fi
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "DIST_TAG=$DIST_TAG"
            echo "DRY_RUN=$DRY"
          } >> "$GITHUB_OUTPUT"
          echo "[npm-publish] version=$VERSION dist-tag=$DIST_TAG dry_run='$DRY'"

      # The `release: published` event fires before goreleaser uploads the
      # platform archives (release-publish.yml runs `build-artifacts` after the
      # release is published). The npm package's postinstall downloads those
      # archives, so publishing before they exist would leave a permanently
      # broken npm version. Wait until every expected asset is on the release.
      # Skipped on --dry-run to allow validation against tags that have no
      # release yet.
      - name: Wait for goreleaser artifacts on the release
        if: steps.version.outputs.DRY_RUN == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))   # 30 minutes
          expected=(
            "octo-cli_${VERSION}_linux_amd64.tar.gz"
            "octo-cli_${VERSION}_linux_arm64.tar.gz"
            "octo-cli_${VERSION}_darwin_amd64.tar.gz"
            "octo-cli_${VERSION}_darwin_arm64.tar.gz"
            "octo-cli_${VERSION}_windows_amd64.zip"
            "octo-cli_${VERSION}_windows_arm64.zip"
            "checksums.txt"
          )
          while :; do
            have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' 2>/dev/null || true)
            missing=()
            for f in "${expected[@]}"; do
              printf '%s\n' "$have" | grep -Fxq "$f" || missing+=("$f")
            done
            if [ ${#missing[@]} -eq 0 ]; then
              echo "[npm-publish] all artifacts present on $TAG"
              break
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::Timed out waiting for goreleaser artifacts on $TAG. Missing: ${missing[*]}"
              exit 1
            fi
            echo "[npm-publish] waiting for ${#missing[@]} artifact(s) on $TAG: ${missing[*]}"
            sleep 15
          done

      - name: Set package version
        run: npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ steps.version.outputs.DIST_TAG }}" ${{ steps.version.outputs.DRY_RUN }}
