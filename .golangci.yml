version: "2"

run:
  timeout: 5m

linters:
  enable:
    # default correctness set
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # additional correctness / style gates
    - bodyclose
    - copyloopvar
    - gocritic
    - gocyclo
    - nolintlint
    - revive
  settings:
    errcheck:
      check-blank: true
    gocyclo:
      min-complexity: 15
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - commentFormatting
        - ifElseChain
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments: ["checkPrivateReceivers"]
        - name: indent-error-flow
        - name: unreachable-code
        - name: superfluous-else
    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - revive
